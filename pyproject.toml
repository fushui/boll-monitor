[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-boll-screener"
version = "0.1.0"
description = "A-share short-term Bollinger Band screener and backtester"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "requests>=2.31",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
boll-strategy = "boll_strategy.cli:main"

[tool.setuptools.packages.find]
include = ["boll_strategy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
